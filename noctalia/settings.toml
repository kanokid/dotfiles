[audio]
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    capsule = true
    capsule_padding = 7.0
    capsule_radius = 11
    center = [ "clock", "weather" ]
    enabled = true
    end = [ "tray", "notifications", "cpu", "ram", "battery", "control-center" ]
    font_weight = 400
    layer = "overlay"
    margin_edge = 5
    margin_ends = 5
    padding = 5
    position = "left"
    shadow = false
    start = [ "session", "workspaces", "media" ]
    thickness = 40

[brightness]
enable_ddcutil = true

[control_center]
hidden_tabs = [ "monitor" ]
sidebar = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "dark_mode"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000003", "desktop-widget-0000000000000004" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 272.0
    box_width = 256.0
    cx = 1392.0
    cy = 200.0
    output = "eDP-1"
    rotation = -0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        color = "primary"
        forecast_days = 6
        shadow = false
        show_forecast = true

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 1348.3499755859375
    cy = 432.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        color = "primary"
        hide_when_no_media = true
        shadow = false

    [desktop_widgets.widget.desktop-widget-0000000000000004]
    box_height = 160.0
    box_width = 336.0
    cx = 1352.0
    cy = 608.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000004.settings]
        bands = 32
        centered = false
        color_1 = "primary"
        color_2 = "tertiary"
        mirrored = false
        show_when_idle = false

[dock]
auto_hide = true
enabled = true
launcher_icon = "rocket"
launcher_position = "start"
magnification = false
reserve_space = false
shadow = false
show_dots = true

[location]
address = "friedens"
auto_locate = true

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004",
