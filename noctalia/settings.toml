    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
        bands = 32
        centered = false
        color_1 = "primary"
        color_2 = "outline"
        mirrored = false
        show_when_idle = false

[osd]
orientation = "vertical"
position_vertical = "center_right"

    [osd.kinds]
    lock_keys = false
    media = false

[plugins]
enabled = [ "noctalia/wallhaven", "noctalia/bongocat", "noctalia/kaomoji" ]

[shell]
app_icon_color = "primary"
corner_radius_scale = 1.5000000223517418
font_family = "Monaspace Krypton Var"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
settings_show_advanced = true

    [shell.launcher]
    session_search = true

    [shell.panel]
    clipboard_placement = "attached"
    polkit_placement = "attached"
    shadow = false
    transparency_mode = "soft"
    wallpaper_position = "center"

[theme]
builtin = "Nord"
community_palette = "GitHub Dark"
custom_palette = "SwayClassic"
mode = "light"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "helix", "hyprland", "kitty", "niri", "qt", "starship", "sway" ]
    community_ids = [ "opencode", "zen-browser", "vscode", "zed", "fuzzel" ]

[wallpaper]
directory = "/home/kanoman/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/kanoman/Pictures/Wallpapers/WallpaperDog-10940926.jpg"

    [wallpaper.last]
    path = "/home/kanoman/Pictures/Wallpapers/WallpaperDog-10940926.jpg"

    [wallpaper.monitor.eDP-1]
    fill_color = "surface"

    [wallpaper.monitors.eDP-1]
    path = "/home/kanoman/Pictures/Wallpapers/WallpaperDog-10940926.jpg"

[weather]
unit = "imperial"

[widget.cat]
audio_spectrum = true
scale = 1.2
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.cat_2]
input_devices = [ "/dev/input/event4", "/dev/input/event*" ]
type = "noctalia/bongocat:cat"

[widget.cat_3]
audio_spectrum = true
input_devices = [ "/dev/input/event4", "/dev/input/event6", "/dev/input/event7" ]
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.cat_4]
type = "noctalia/bongocat:cat"

[widget.cat_5]
audio_spectrum = true
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clock]
scale = 0.94999999999999996
vertical_format = "{:%I\\n%M %b %-d}"

[widget.control-center]
custom_image_colorize = true

[widget.cpu]
display = "text"
glyph = "cpu"
highlight_color = "primary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
scale = 1.3500000000000001
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
display = "text"
highlight_color = "primary"
icon_color = "on_surface"
stat = "ram_pct"

[widget.session]
capsule = true
capsule_radius = "auto"

[widget.sysmon]
stat = "ram_used"

[widget.workspaces]
active_pill_size = 1.8
capsule = true
display = "none"
empty_color = "outline"
inactive_pill_size = 1.4000000000000001
occupied_color = "outline"