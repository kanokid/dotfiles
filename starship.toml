format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "#00639a"

[character]
success_symbol = "[❯](#505e7d)"
error_symbol = "[❯](#ba1a1a)"
vimcmd_symbol = "[❮](#00639a)"

[git_branch]
format = "[$branch]($style)"
style = "#404750"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "#575a8b"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#404750"

[cmd_duration]
format = "[$duration]($style) "
style = "#575a8b"

[python]
format = "[$virtualenv]($style) "
style = "#404750"
detect_extensions = []
detect_files = []
