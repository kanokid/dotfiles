format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "#e65100"

[character]
success_symbol = "[❯](#ff9800)"
error_symbol = "[❯](#b3261e)"
vimcmd_symbol = "[❮](#e65100)"

[git_branch]
format = "[$branch]($style)"
style = "#52443d"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "#ff9800"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#52443d"

[cmd_duration]
format = "[$duration]($style) "
style = "#ff9800"

[python]
format = "[$virtualenv]($style) "
style = "#52443d"
detect_extensions = []
detect_files = []
