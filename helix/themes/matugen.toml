# Helix Theme Template using Material You with improved contrast

# --- Syntax Elements ---

"attribute" = "#00687b"
"type" = "#416277"
"type.enum.variant" = "#416277"
"constructor" = "#afecff"

"constant" = "#3d6187"
"constant.character" = "#3d6187"
"constant.character.escape" = "#d1e4ff"

"string" = "#00687b"
"string.regexp" = "#d1e4ff"
"string.special" = "#afecff"
"string.special.symbol" = "#ba1a1a"

"comment" = { fg = "#3d494d", modifiers = ["italic"] }

"variable" = "#121d21"
"variable.parameter" = { fg = "#ffdad6", modifiers = ["italic"] }
"variable.builtin" = "#ba1a1a"
"variable.other.member" = "#00687b"

"label" = "#afecff"

"punctuation" = "#3d494d"
"punctuation.special" = "#416277"

"keyword" = "#00687b"
"keyword.control.conditional" = { fg = "#00687b", modifiers = ["italic"] }

"operator" = "#416277"

"function" = "#00687b"
"function.macro" = "#afecff"

"tag" = "#00687b"
"namespace" = { fg = "#416277", modifiers = ["italic"] }

"special" = "#00687b"

# --- Markup ---

"markup.heading.1" = "#ba1a1a"
"markup.heading.2" = "#00687b"
"markup.heading.3" = "#416277"
"markup.heading.4" = "#3d6187"
"markup.heading.5" = "#afecff"
"markup.heading.6" = "#004e5d"

"markup.list" = "#416277"
"markup.list.unchecked" = "#3d494d"
"markup.list.checked" = "#afecff"

"markup.bold" = { fg = "#00687b", modifiers = ["bold"] }
"markup.italic" = { fg = "#416277", modifiers = ["italic"] }

"markup.link.url" = { fg = "#00687b", modifiers = ["italic", "underlined"] }
"markup.link.text" = "#afecff"
"markup.link.label" = "#3d6187"
"markup.raw" = "#001d36"
"markup.quote" = "#d1e4ff"

# --- Diff ---

"diff.plus" = "#3d6187"
"diff.minus" = "#ba1a1a"
"diff.delta" = "#00687b"

# --- UI Elements ---

"ui.background" = { fg = "#121d21", bg = "none" }

"ui.linenr" = { fg = "#3d494d" }
"ui.linenr.selected" = { fg = "#afecff" }

"ui.statusline" = { fg = "#001f27", bg = "none" }
"ui.statusline.inactive" = { fg = "#3d494d", bg = "none" }
"ui.statusline.normal" = { fg = "#f1fbff", bg = "none", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#f1fbff", bg = "none", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#f1fbff", bg = "none", modifiers = ["bold"] }

"ui.popup" = { fg = "#121d21", bg = "none" }
"ui.window" = { fg = "#3d494d" }
"ui.help" = { fg = "#3d494d", bg = "none" }

"ui.bufferline" = { fg = "#3d494d", bg = "none" }
"ui.bufferline.active" = { fg = "#ffffff", bg = "#00687b", underline = { color = "#00687b", style = "line" } }
"ui.bufferline.background" = { bg = "none" }

"ui.text" = "#121d21"
"ui.text.focus" = { fg = "#00687b", bg = "none", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "#3d494d" }
"ui.text.directory" = { fg = "#00687b" }

"ui.virtual" = "#3d494d"
"ui.virtual.ruler" = { bg = "none" }
"ui.virtual.indent-guide" = "#e9f6fa"
"ui.virtual.inlay-hint" = { fg = "#3d494d", bg = "none" }
"ui.virtual.jump-label" = { fg = "#afecff", modifiers = ["bold"] }

"ui.selection" = { bg = "#bcc9cd" }

"ui.cursor" = { fg = "#f1fbff", bg = "#001f27" }
"ui.cursor.primary" = { fg = "#f1fbff", bg = "#afecff" }
"ui.cursor.match" = { fg = "#001f27", modifiers = ["bold"] }

"ui.highlight" = { bg = "#c5e7ff", modifiers = ["bold"] }

"ui.menu" = { fg = "#121d21", bg = "none" }
"ui.menu.selected" = { fg = "#00687b", bg = "none", modifiers = ["bold"] }

# --- Diagnostics ---

"diagnostic.error" = { fg = "#ba1a1a", underline = { color = "#ba1a1a", style = "curl" } }
"diagnostic.warning" = { fg = "#416277", underline = { color = "#416277", style = "curl" } }
"diagnostic.info" = { fg = "#3d6187", underline = { color = "#3d6187", style = "curl" } }
"diagnostic.hint" = { fg = "#d1e4ff", underline = { color = "#d1e4ff", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

# --- Fallbacks (non-template usage) ---

error = "#ba1a1a"
warning = "#3d6187"
info = "#00687b"
hint = "#416277"
