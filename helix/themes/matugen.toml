# Helix Theme Template using Material You with improved contrast

# --- Syntax Elements ---

"attribute" = "#00639a"
"type" = "#3e6281"
"type.enum.variant" = "#3e6281"
"constructor" = "#cde5ff"

"constant" = "#853fa4"
"constant.character" = "#853fa4"
"constant.character.escape" = "#c77de6"

"string" = "#00639a"
"string.regexp" = "#c77de6"
"string.special" = "#cde5ff"
"string.special.symbol" = "#ba1a1a"

"comment" = { fg = "#3f4851", modifiers = ["italic"] }

"variable" = "#171c21"
"variable.parameter" = { fg = "#ffdad6", modifiers = ["italic"] }
"variable.builtin" = "#ba1a1a"
"variable.other.member" = "#00639a"

"label" = "#cde5ff"

"punctuation" = "#3f4851"
"punctuation.special" = "#3e6281"

"keyword" = "#00639a"
"keyword.control.conditional" = { fg = "#00639a", modifiers = ["italic"] }

"operator" = "#3e6281"

"function" = "#00639a"
"function.macro" = "#19a2f5"

"tag" = "#00639a"
"namespace" = { fg = "#3e6281", modifiers = ["italic"] }

"special" = "#00639a"

# --- Markup ---

"markup.heading.1" = "#ba1a1a"
"markup.heading.2" = "#00639a"
"markup.heading.3" = "#3e6281"
"markup.heading.4" = "#853fa4"
"markup.heading.5" = "#cde5ff"
"markup.heading.6" = "#004a75"

"markup.list" = "#3e6281"
"markup.list.unchecked" = "#3f4851"
"markup.list.checked" = "#cde5ff"

"markup.bold" = { fg = "#00639a", modifiers = ["bold"] }
"markup.italic" = { fg = "#3e6281", modifiers = ["italic"] }

"markup.link.url" = { fg = "#00639a", modifiers = ["italic", "underlined"] }
"markup.link.text" = "#cde5ff"
"markup.link.label" = "#853fa4"
"markup.raw" = "#170024"
"markup.quote" = "#c77de6"

# --- Diff ---

"diff.plus" = "#853fa4"
"diff.minus" = "#ba1a1a"
"diff.delta" = "#00639a"

# --- UI Elements ---

"ui.background" = { fg = "#171c21", bg = "none" }

"ui.linenr" = { fg = "#3f4851" }
"ui.linenr.selected" = { fg = "#cde5ff" }

"ui.statusline" = { fg = "#000c19", bg = "none" }
"ui.statusline.inactive" = { fg = "#3f4851", bg = "none" }
"ui.statusline.normal" = { fg = "#f7f9ff", bg = "none", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#f7f9ff", bg = "none", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#f7f9ff", bg = "none", modifiers = ["bold"] }

"ui.popup" = { fg = "#171c21", bg = "none" }
"ui.window" = { fg = "#3f4851" }
"ui.help" = { fg = "#3f4851", bg = "none" }

"ui.bufferline" = { fg = "#3f4851", bg = "none" }
"ui.bufferline.active" = { fg = "#ffffff", bg = "#00639a", underline = { color = "#00639a", style = "line" } }
"ui.bufferline.background" = { bg = "none" }

"ui.text" = "#171c21"
"ui.text.focus" = { fg = "#00639a", bg = "none", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "#3f4851" }
"ui.text.directory" = { fg = "#00639a" }

"ui.virtual" = "#3f4851"
"ui.virtual.ruler" = { bg = "none" }
"ui.virtual.indent-guide" = "#f0f4fb"
"ui.virtual.inlay-hint" = { fg = "#3f4851", bg = "none" }
"ui.virtual.jump-label" = { fg = "#19a2f5", modifiers = ["bold"] }

"ui.selection" = { bg = "#bec7d3" }

"ui.cursor" = { fg = "#f7f9ff", bg = "#000c19" }
"ui.cursor.primary" = { fg = "#f7f9ff", bg = "#cde5ff" }
"ui.cursor.match" = { fg = "#000c19", modifiers = ["bold"] }

"ui.highlight" = { bg = "#b4d8fd", modifiers = ["bold"] }

"ui.menu" = { fg = "#171c21", bg = "none" }
"ui.menu.selected" = { fg = "#00639a", bg = "none", modifiers = ["bold"] }

# --- Diagnostics ---

"diagnostic.error" = { fg = "#ba1a1a", underline = { color = "#ba1a1a", style = "curl" } }
"diagnostic.warning" = { fg = "#3e6281", underline = { color = "#3e6281", style = "curl" } }
"diagnostic.info" = { fg = "#853fa4", underline = { color = "#853fa4", style = "curl" } }
"diagnostic.hint" = { fg = "#c77de6", underline = { color = "#c77de6", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

# --- Fallbacks (non-template usage) ---

error = "#ba1a1a"
warning = "#853fa4"
info = "#00639a"
hint = "#3e6281"
