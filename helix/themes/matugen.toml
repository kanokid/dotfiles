# Helix Theme Template using Material You with improved contrast

# --- Syntax Elements ---

"attribute" = "#e65100"
"type" = "#ff9800"
"type.enum.variant" = "#ff9800"
"constructor" = "#ffecb3"

"constant" = "#ff9800"
"constant.character" = "#ff9800"
"constant.character.escape" = "#f6e5de"

"string" = "#e65100"
"string.regexp" = "#f6e5de"
"string.special" = "#ffecb3"
"string.special.symbol" = "#b3261e"

"comment" = { fg = "#52443d", modifiers = ["italic"] }

"variable" = "#221a16"
"variable.parameter" = { fg = "#f9dedc", modifiers = ["italic"] }
"variable.builtin" = "#b3261e"
"variable.other.member" = "#e65100"

"label" = "#ffecb3"

"punctuation" = "#52443d"
"punctuation.special" = "#ff9800"

"keyword" = "#e65100"
"keyword.control.conditional" = { fg = "#e65100", modifiers = ["italic"] }

"operator" = "#ff9800"

"function" = "#e65100"
"function.macro" = "#ffecb3"

"tag" = "#e65100"
"namespace" = { fg = "#ff9800", modifiers = ["italic"] }

"special" = "#e65100"

# --- Markup ---

"markup.heading.1" = "#b3261e"
"markup.heading.2" = "#e65100"
"markup.heading.3" = "#ff9800"
"markup.heading.4" = "#ff9800"
"markup.heading.5" = "#ffecb3"
"markup.heading.6" = "#ffffff"

"markup.list" = "#ff9800"
"markup.list.unchecked" = "#52443d"
"markup.list.checked" = "#ffecb3"

"markup.bold" = { fg = "#e65100", modifiers = ["bold"] }
"markup.italic" = { fg = "#ff9800", modifiers = ["italic"] }

"markup.link.url" = { fg = "#e65100", modifiers = ["italic", "underlined"] }
"markup.link.text" = "#ffecb3"
"markup.link.label" = "#ff9800"
"markup.raw" = "#221a16"
"markup.quote" = "#f6e5de"

# --- Diff ---

"diff.plus" = "#ff9800"
"diff.minus" = "#b3261e"
"diff.delta" = "#e65100"

# --- UI Elements ---

"ui.background" = { fg = "#221a16", bg = "none" }

"ui.linenr" = { fg = "#52443d" }
"ui.linenr.selected" = { fg = "#ffecb3" }

"ui.statusline" = { fg = "#221a16", bg = "none" }
"ui.statusline.inactive" = { fg = "#52443d", bg = "none" }
"ui.statusline.normal" = { fg = "#fff8f6", bg = "none", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "#fff8f6", bg = "none", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "#fff8f6", bg = "none", modifiers = ["bold"] }

"ui.popup" = { fg = "#221a16", bg = "none" }
"ui.window" = { fg = "#52443d" }
"ui.help" = { fg = "#52443d", bg = "none" }

"ui.bufferline" = { fg = "#52443d", bg = "none" }
"ui.bufferline.active" = { fg = "#ffffff", bg = "#e65100", underline = { color = "#e65100", style = "line" } }
"ui.bufferline.background" = { bg = "none" }

"ui.text" = "#221a16"
"ui.text.focus" = { fg = "#e65100", bg = "none", modifiers = ["bold"] }
"ui.text.inactive" = { fg = "#52443d" }
"ui.text.directory" = { fg = "#e65100" }

"ui.virtual" = "#52443d"
"ui.virtual.ruler" = { bg = "none" }
"ui.virtual.indent-guide" = "#feece5"
"ui.virtual.inlay-hint" = { fg = "#52443d", bg = "none" }
"ui.virtual.jump-label" = { fg = "#ffecb3", modifiers = ["bold"] }

"ui.selection" = { bg = "#f4ded5" }

"ui.cursor" = { fg = "#fff8f6", bg = "#221a16" }
"ui.cursor.primary" = { fg = "#fff8f6", bg = "#ffecb3" }
"ui.cursor.match" = { fg = "#221a16", modifiers = ["bold"] }

"ui.highlight" = { bg = "#f6e5de", modifiers = ["bold"] }

"ui.menu" = { fg = "#221a16", bg = "none" }
"ui.menu.selected" = { fg = "#e65100", bg = "none", modifiers = ["bold"] }

# --- Diagnostics ---

"diagnostic.error" = { fg = "#b3261e", underline = { color = "#b3261e", style = "curl" } }
"diagnostic.warning" = { fg = "#ff9800", underline = { color = "#ff9800", style = "curl" } }
"diagnostic.info" = { fg = "#ff9800", underline = { color = "#ff9800", style = "curl" } }
"diagnostic.hint" = { fg = "#f6e5de", underline = { color = "#f6e5de", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }

# --- Fallbacks (non-template usage) ---

error = "#b3261e"
warning = "#ff9800"
info = "#e65100"
hint = "#ff9800"
